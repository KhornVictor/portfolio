name: Deploy Vue app via SFTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_IMAGE_BASE: ${{ secrets.VITE_IMAGE_BASE }}

      # Namecheap shared hosting firewalls FTP from GitHub's IP ranges, so
      # upload over SFTP on their SSH port (21098) using the cPanel account.
      - name: Deploy to server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.PORTFOLIO_SERVER }}
          port: 21098
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local_path: ./dist/*
          remote_path: /home/khorjzbf/public_html/portfolio
          sftp_only: true
